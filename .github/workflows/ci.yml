name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Only fail on real bugs (syntax errors, undefined names) so this
      # doesn't block on pre-existing style nits across the codebase.
      - name: Lint for syntax errors / undefined names
        run: ruff check --select=E9,F63,F7,F82 .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest boto3 pandas pyarrow python-dotenv numpy scipy

      # These tests validate data already landed in S3 and skip themselves
      # when AWS/S3 config isn't present (see tests/test_data_validation_*.py),
      # so this runs safely without cloud credentials in CI.
      - name: Run data validation tests
        run: pytest tests/ -v

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: docker/Dockerfile.api
          - name: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow
          - name: streamlit-app
            context: app
            dockerfile: app/dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: taxi-mlops-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
