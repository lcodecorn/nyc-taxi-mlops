# =============================================================================
# EC2 variant of docker-compose.yml
# =============================================================================
# Deltas from the local-dev compose file, and why each one matters once this
# stack runs unattended on an EC2 box that gets started/stopped on a schedule:
#
# 1. AWS credentials come from the instance's IAM role, not static keys.
#    The original file injects AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from
#    .env into every container. On EC2 you instead attach an IAM instance
#    profile to the box (the same role that grants ec2:StopInstances to the
#    self-stop task) and let boto3 pick up temporary credentials from the
#    instance metadata service (IMDS) automatically — no long-lived keys
#    baked into a volume-mounted .env file.
#
#    GOTCHA: by default IMDSv2 responses have an HTTP PUT response hop limit
#    of 1, which Docker's bridge network adds a hop to — so containers can't
#    reach 169.254.169.254 out of the box. Fix it once on the host with:
#        aws ec2 modify-instance-metadata-options \
#            --instance-id <id> --http-put-response-hop-limit 2 \
#            --http-tokens required
#    (alternatively run affected services with `network_mode: host`).
#
# 2. Webserver / Flower ports are bound to 127.0.0.1 only.
#    The local-dev file maps them to 0.0.0.0, which on EC2 means "open to
#    whatever the security group allows" — easy to accidentally expose the
#    Airflow UI to the internet. Bind to localhost and reach them via an SSH
#    tunnel (`ssh -L 8080:localhost:8080 ec2-user@<host>`) or put a reverse
#    proxy with auth in front if you need regular browser access.
#
# 3. MLflow does not run on this box at all — it's hosted on a private
#    Hugging Face Space (see mlflow_space/Dockerfile). MLFLOW_TRACKING_URI
#    points at the Space's URL, and MLFLOW_TRACKING_TOKEN carries an HF
#    access token that mlflow's client sends as a Bearer header automatically
#    (no extra code — see requirements/airflow.txt already pulling in mlflow).
#    Rationale: keeps experiment history/artifacts alive independent of this
#    instance's stop/start cycle, and off the box entirely when it's stopped.
#
# Everything else (services, healthchecks, volumes, restart policies) is
# unchanged — `restart: always` already means the stack comes back up after
# a reboot, as long as Docker itself is enabled to start on boot and
# `docker compose up -d` runs once at startup (see docker/Dockerfile.airflow-ec2).
# =============================================================================
---
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Default is 1s; the first send imports redis.client, which can take ~1s on
    # Docker/WSL2 — the timeout then leaves a half-imported module and every task
    # fails with "module 'redis' has no attribute 'client'".
    AIRFLOW__CELERY__OPERATION_TIMEOUT: '10'
    # No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY here — boto3 picks up
    # temporary credentials from the instance's IAM role via IMDS instead.
    AWS_REGION: ${AWS_REGION:-}
    S3_BUCKET: ${S3_BUCKET:-}
    # MLflow now lives on a private Hugging Face Space, not in this stack —
    # see mlflow_space/Dockerfile. MLFLOW_TRACKING_TOKEN is an HF access
    # token; mlflow's client sends it as a Bearer header automatically.
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
    ALERT_EMAIL: ${ALERT_EMAIL:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    OPTUNA_N_TRIALS: ${OPTUNA_N_TRIALS:-20}
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags/ec2:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/preprocess:/opt/airflow/preprocess
    - ${AIRFLOW_PROJ_DIR:-.}/ingestion:/opt/airflow/ingestion
    - ${AIRFLOW_PROJ_DIR:-.}/models/ec2:/opt/airflow/models/ec2
    - ${AIRFLOW_PROJ_DIR:-.}/monitoring:/opt/airflow/monitoring
    - ${AIRFLOW_PROJ_DIR:-.}/tests:/opt/airflow/tests
    - ${AIRFLOW_PROJ_DIR:-.}/.env:/opt/airflow/.env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Bound to localhost only — reach it via `ssh -L 8080:localhost:8080 ...`
      # or put an authenticated reverse proxy in front. Do not open this
      # security-group port to 0.0.0.0/0.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      # Bound to localhost only — same reasoning as the webserver above.
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
